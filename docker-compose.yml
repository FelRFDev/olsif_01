version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=olsif_db
      - POSTGRES_USER=olsif_user
      - POSTGRES_PASSWORD=olsif_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: on-failure

  web:
    build: .
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_NAME=olsif_db
      - POSTGRES_USER=olsif_user
      - POSTGRES_PASSWORD=olsif_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=1
      - SECRET_KEY=django-insecure-olsif-mvp-key-123
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data:
